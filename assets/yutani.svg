<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="crtBg" gradientUnits="userSpaceOnUse" cx="128" cy="128" r="160">
      <stop offset="0" stop-color="#1A1408"/>
      <stop offset="1" stop-color="#080806"/>
    </radialGradient>
    <linearGradient id="amberGlow" gradientUnits="userSpaceOnUse" x1="8" y1="8" x2="248" y2="248">
      <stop offset="0" stop-color="#FFE078"/>
      <stop offset="0.5" stop-color="#FFB428"/>
      <stop offset="1" stop-color="#C87A10"/>
    </linearGradient>
    <linearGradient id="gamutGrad" gradientUnits="userSpaceOnUse" x1="58" y1="196" x2="204" y2="50">
      <stop offset="0" stop-color="#4590FF" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#4BE660" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#F54B40" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- Outer CRT Chassis Frame -->
  <rect x="8" y="8" width="240" height="240" rx="26" ry="26" fill="url(#crtBg)" stroke="url(#amberGlow)" stroke-width="5"/>
  <rect x="20" y="20" width="216" height="216" rx="18" ry="18" fill="none" stroke="#5A3C0E" stroke-width="2"/>

  <!-- Yutani Corner Telemetry Brackets -->
  <path d="M 32 56 L 32 32 L 56 32" fill="none" stroke="#FFB428" stroke-width="4" stroke-linecap="square"/>
  <path d="M 200 32 L 224 32 L 224 56" fill="none" stroke="#FFB428" stroke-width="4" stroke-linecap="square"/>
  <path d="M 32 200 L 32 224 L 56 224" fill="none" stroke="#FFB428" stroke-width="4" stroke-linecap="square"/>
  <path d="M 200 224 L 224 224 L 224 200" fill="none" stroke="#FFB428" stroke-width="4" stroke-linecap="square"/>

  <!-- CIE 1931 Gamut Triangle (R, G, B Primaries) -->
  <polygon points="96,48 204,166 58,196" fill="url(#gamutGrad)" stroke="#FFB428" stroke-width="3" stroke-linejoin="round"/>

  <!-- Primary Vertex Nodes (Green Top, Red Right, Blue Bottom-Left) -->
  <circle cx="96" cy="48" r="7" fill="#4BE660" stroke="#080806" stroke-width="2"/>
  <circle cx="204" cy="166" r="7" fill="#F54B40" stroke="#080806" stroke-width="2"/>
  <circle cx="58" cy="196" r="7" fill="#559BFF" stroke="#080806" stroke-width="2"/>

  <!-- Spyder Optical Aperture Reticle Ring -->
  <circle cx="128" cy="134" r="46" fill="none" stroke="url(#amberGlow)" stroke-width="3.5" stroke-dasharray="12 6"/>
  <circle cx="128" cy="134" r="25" fill="#0E0C08" fill-opacity="0.80" stroke="#5AEBB8" stroke-width="2.5"/>

  <!-- D65 Whitepoint Crosshair -->
  <line x1="92" y1="134" x2="164" y2="134" stroke="#FFB428" stroke-width="2.5"/>
  <line x1="128" y1="98" x2="128" y2="170" stroke="#FFB428" stroke-width="2.5"/>
  <circle cx="128" cy="134" r="5.5" fill="#FFF4D0"/>
</svg>
