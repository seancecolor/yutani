<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="crtBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1A1408"/>
      <stop offset="100%" stop-color="#080806"/>
    </radialGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE078"/>
      <stop offset="50%" stop-color="#FFB428"/>
      <stop offset="100%" stop-color="#C87A10"/>
    </linearGradient>
    <linearGradient id="gamutGrad" x1="15%" y1="85%" x2="85%" y2="15%">
      <stop offset="0%" stop-color="#4590FF" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#4BE660" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#F54B40" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- Outer CRT Chassis Frame -->
  <rect x="8" y="8" width="240" height="240" rx="28" ry="28" fill="url(#crtBg)" stroke="url(#amberGlow)" stroke-width="5"/>
  <rect x="20" y="20" width="216" height="216" rx="18" ry="18" fill="none" stroke="#5A3C0E" stroke-width="2"/>

  <!-- Yutani Corner Telemetry Brackets -->
  <path d="M 32 56 L 32 32 L 56 32" fill="none" stroke="#FFB428" stroke-width="4" stroke-linecap="square"/>
  <path d="M 200 32 L 224 32 L 224 56" fill="none" stroke="#FFB428" stroke-width="4" stroke-linecap="square"/>
  <path d="M 32 200 L 32 224 L 56 224" fill="none" stroke="#FFB428" stroke-width="4" stroke-linecap="square"/>
  <path d="M 200 224 L 224 224 L 224 200" fill="none" stroke="#FFB428" stroke-width="4" stroke-linecap="square"/>

  <!-- CIE 1931 Gamut Triangle (R, G, B Primaries) -->
  <polygon points="96,52 202,164 62,192" fill="url(#gamutGrad)" stroke="#FFB428" stroke-width="3" stroke-linejoin="round"/>

  <!-- Primary Vertex Nodes (Green Top, Red Right, Blue Bottom-Left) -->
  <circle cx="96" cy="52" r="6.5" fill="#4BE660" stroke="#080806" stroke-width="2"/>
  <circle cx="202" cy="164" r="6.5" fill="#F54B40" stroke="#080806" stroke-width="2"/>
  <circle cx="62" cy="192" r="6.5" fill="#559BFF" stroke="#080806" stroke-width="2"/>

  <!-- Spyder Optical Aperture Reticle Ring -->
  <circle cx="128" cy="134" r="46" fill="none" stroke="url(#amberGlow)" stroke-width="3.5" stroke-dasharray="12 6"/>
  <circle cx="128" cy="134" r="24" fill="#0E0C08" fill-opacity="0.75" stroke="#5AEBB8" stroke-width="2.5"/>

  <!-- D65 Whitepoint Crosshair -->
  <line x1="92" y1="134" x2="164" y2="134" stroke="#FFB428" stroke-width="2.2"/>
  <line x1="128" y1="98" x2="128" y2="170" stroke="#FFB428" stroke-width="2.2"/>
  <circle cx="128" cy="134" r="5" fill="#FFF4D0"/>

  <!-- Bottom YUTANI HUD Label -->
  <text x="128" y="218" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="18" letter-spacing="5" fill="#FFB428">YUTANI</text>
</svg>
